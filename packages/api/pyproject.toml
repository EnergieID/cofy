[project]
name = "cofy-api"
authors = [
    { name="EnergyID", email = "info@energieid.be" },
    { name="Jorg" }
]
version = "0.0.0"
description = "An open-source modular framework for ingesting, standardising, storing, and computing energy-related data."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=47.0.0",
    "fastapi>=0.142.0",
    "opentelemetry-api>=1.44.0",
    "pydantic>=2.11.0",
    "pydantic-core>=2.33.0",
    "starlette>=0.46.0",
]

[project.optional-dependencies]
timeseries = [
    "isodate>=0.7.2",
    "narwhals>=2.22.0"
]
tariff = [
    "cofy-api[timeseries]",
]
billing = [
    "cofy-api[timeseries]",
    "energy-cost>=0.9.0,<0.10",
    "pandas>=2.2.0"
]
production = [
    "cofy-api[timeseries]",
]
members = [
    "energy-cost>=0.9.0,<0.10",
]
directive = [
    "cofy-api[timeseries]",
    "narwhals>=2.22.0"
]
simultaneity = [
    "cofy-api[timeseries]",
    "narwhals>=2.22.0"
]
entsoe = [
    "cofy-api[tariff]",
    "entsoe-py>=0.7.10",
    "pandas>=2.2.0"
]
energy-cost = [
    "cofy-api[tariff]",
    "energy-cost>=0.9.0,<0.10",
    "pandas>=2.2.0"
]
energyid = [
    "cofy-api[production]",
    "polars>=1.38.1",
    "requests>=2.32.0",
]
acc = [
    "cofy-api[simultaneity]",
    "google-auth>=2.40.0",
    "polars>=1.38.1",
    "requests>=2.32.0",
]
elia = [
    "cofy-api[timeseries]",
    "httpx>=0.28.0",
    "polars>=1.38.1",
]
ned = [
    "cofy-api[timeseries]",
    "httpx>=0.28.0",
    "polars>=1.38.1",
]
demo = [
    "cofy-api[tariff,production,directive,simultaneity,members]",
    "polars>=1.38.1",
    "uvicorn[standard]>=0.30.0",
]
all = ["cofy-api[timeseries,tariff,members,production,directive,simultaneity,billing,entsoe,energy-cost,energyid,acc,elia,ned,demo]"]

[project.urls]
Source = "https://github.com/EnergieID/cofy"
Changelog = "https://github.com/EnergieID/cofy/releases"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[dependency-groups]
dev = [
    "cofy-api[all]",
    "httpx>=0.28.0",
    "opentelemetry-sdk>=1.44.0",
    "poethepoet>=0.37.0",
    "pyinstrument>=5.1.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]

[tool.poe.env]
PYTHONPYCACHEPREFIX = ".pycache"

[tool.poe.tasks]
lint = "ruff check --fix"
format = "ruff format"
check = "ty check"
test = "pytest --cov=cofy --cov-report=term-missing --import-mode=importlib tests"

[tool.coverage.report]
skip_covered = true

[tool.coverage.run]
source = ["cofy"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = [
    "E501",
]

name: Deploy to a server

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment with the server's SCALEWAY_SSH_* secrets.
        required: true
        type: string
      ref:
        description: The branch or tag to deploy, such as refs/heads/main; the server checks it may.
        required: true
        type: string
      create_tag_at:
        description: A commit to first create the tag `ref` names at, once the environment allows the deploy.
        required: false
        default: ''
        type: string

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Tag the release
        if: inputs.create_tag_at != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          SHA: ${{ inputs.create_tag_at }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="$REF" -f sha="$SHA"

      # The deploy key can only make the server run cofy-deploy (see apps/demo_multitenant/cloud-init.yaml), which reads
      # what the ref points at by itself; all it is sent is the ref and a registry login that expires with this job.
      - name: Deploy
        env:
          HOST: ${{ secrets.SCALEWAY_SSH_HOST }}
          KEY: ${{ secrets.SCALEWAY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCALEWAY_SSH_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REF: ${{ inputs.ref }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          echo "$KEY" > ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n%s\n' "$ACTOR" "$TOKEN" "$REF" | ssh -i ~/.ssh/deploy "deploy@$HOST"

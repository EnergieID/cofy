name: Deploy to Scaleway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-scaleway
  cancel-in-progress: true

jobs:
  test-container:
    uses: ./.github/workflows/test-container-management.yml

  build:
    needs: test-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/energieid/cofy-api/management
      RUNNER_IMAGE: ghcr.io/energieid/cofy-api/runner
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both from the same commit, so the runner builds the community configs with the same cofy-api the management
      # API validated them with.
      - name: Build and push
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            -f apps/demo_multitenant/management.Dockerfile \
            .
          docker build \
            -t ${{ env.RUNNER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.RUNNER_IMAGE }}:latest \
            -f apps/demo_multitenant/runner.Dockerfile \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.RUNNER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.RUNNER_IMAGE }}:latest

  # The dev server only accepts main, so running this by hand from another branch builds its images, but deploys none.
  deploy:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-to-server.yml
    with:
      environment: multitenant-dev
      ref: ${{ github.ref }}
    secrets: inherit

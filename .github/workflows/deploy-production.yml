name: Deploy to production

# Releases main as the next cloud-v<YYYY.MM.DD.N> tag, N counting that day's releases from 1, and deploys it, or
# deploys an earlier tag again, to go back to it. Either way it deploys the images `deploy-scaleway.yml` built for that
# commit, so a new release waits for those.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: An earlier tag, such as cloud-v2026.10.20.1, to deploy again; empty releases main as the next one.
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      create_at: ${{ steps.pick.outputs.create_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the tag
        id: pick
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            if [[ $TAG != cloud-v* ]] ||! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG is not an earlier release"
              exit 1
            fi
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            sha=$(git rev-parse origin/main)
            for image in management runner website; do
              if ! docker manifest inspect "ghcr.io/energieid/cofy-api/$image:$sha" >/dev/null; then
                echo "::error::$sha has no $image image yet; release it once Deploy to Scaleway built it"
                exit 1
              fi
            done
            today=$(date -u +%Y.%m.%d)
            last=$(git tag --list "cloud-v$today.*" | sed -n "s/^cloud-v${today//./\\.}\.\([0-9]\+\)$/\1/p" | sort -n | tail -n 1)
            tag=cloud-v$today.$(( ${last:-0} + 1 ))
            echo "Releasing $sha as $tag"
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "create_at=$sha" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: prepare
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/deploy-to-server.yml
    with:
      environment: multitenant-prod
      ref: ${{ needs.prepare.outputs.ref }}
      create_tag_at: ${{ needs.prepare.outputs.create_at }}
    secrets: inherit

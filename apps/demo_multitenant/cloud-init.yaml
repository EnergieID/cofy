#cloud-config
# Provisions a Scaleway instance made from the Docker app image, which brings Docker and its compose plugin; Scaleway
# names the host after the instance. Each environment gets its own deploy key, in place of the one below.
# The server still needs what this doesn't carry, see README.md: `/opt/cofy/.env`, and the data, on a volume
# labelled `cofy-data`.
timezone: UTC

package_update: true
package_upgrade: true
packages:
  - git
  - ufw
  - fail2ban
  - unattended-upgrades

users:
  # Who logs in to look after the server.
  - name: cofy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa  jorg@mixpss
  # GitHub Actions' key: it can only run cofy-deploy - no shell, no forwarding, no docker of its own.
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - restrict,command="sudo /usr/local/bin/cofy-deploy" ssh-ed25519 REPLACE_WITH_THE_DEPLOY_PUBLIC_KEY github-actions-deploy

ssh_pwauth: false
disable_root: true

swap:
  filename: /swapfile
  size: 2147483648  # 2 GiB
  maxsize: 2147483648

# The data volume, formatted and labelled by hand: `mkfs.ext4 -L cofy-data /dev/sdX` for a new one.
mounts:
  - [LABEL=cofy-data, /data, ext4, "defaults,nofail", "0", "2"]

write_files:
  - path: /etc/ssh/sshd_config.d/10-cofy.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers cofy deploy

  - path: /etc/sudoers.d/cofy-deploy
    permissions: '0440'
    content: |
      deploy ALL=(root) NOPASSWD: /usr/local/bin/cofy-deploy ""

  # Without rotation, Docker keeps every container's log forever.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

  # Docker waits for the data volume, rather than starting the apps on an empty /data.
  - path: /etc/systemd/system/docker.service.d/data.conf
    content: |
      [Unit]
      RequiresMountsFor=/data

  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  - path: /usr/local/bin/cofy-deploy
    permissions: '0755'
    content: |
      #!/bin/bash
      # Deploys a branch or tag of the repository, if it is one this server's `.env` allows in COFY_DEPLOY_REFS. It
      # reads what that ref points at from GitHub itself; on stdin it takes a user name line and a token line, the
      # registry login, then the ref, such as refs/heads/main.
      set -euo pipefail
      repo=EnergieID/cofy-api
      app=apps/demo_multitenant
      cd /opt/cofy

      read -r user
      read -r token
      read -r ref

      allowed=$(sed -n 's/^COFY_DEPLOY_REFS=//p' .env)
      if [[ ! $ref =~ ^refs/(heads|tags)/[A-Za-z0-9._/-]+$ || -z $allowed || $ref != $allowed ]]; then
        echo "$ref is not deployed here" >&2
        exit 1
      fi
      # An annotated tag is listed twice, the second time peeled to its commit.
      sha=$(git ls-remote "https://github.com/$repo.git" "$ref" | awk -v ref="$ref" '$2 == ref || $2 == ref "^{}" { sha = $1 } END { print sha }')
      [[ $sha =~ ^[0-9a-f]{40}$ ]]
      echo "Deploying $ref, at $sha"

      for file in docker-compose.yml Caddyfile config.alloy; do
        curl -fsSL -o "$file.new" "https://raw.githubusercontent.com/$repo/$sha/$app/$file"
      done
      for file in docker-compose.yml Caddyfile config.alloy; do
        mv "$file.new" "$file"
      done

      # The login lasts only as long as this deploy.
      export DOCKER_CONFIG=$(mktemp -d)
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      docker login ghcr.io --username "$user" --password-stdin <<<"$token"

      # Images no container uses go both before and after the pull, so what a failed deploy leaves behind
      # never takes the room the next one needs.
      export COFY_VERSION=$sha
      docker image prune -af
      docker compose pull
      docker compose up -d --remove-orphans
      docker image prune -af

runcmd:
  - install -d -m 700 /opt/cofy
  - systemctl daemon-reload
  - systemctl restart ssh docker

  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable

  - systemctl enable --now fail2ban unattended-upgrades

final_message: "cofy host ready after $UPTIME seconds"

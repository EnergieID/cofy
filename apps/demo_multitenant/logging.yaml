# How both images log, given to uvicorn as UVICORN_LOG_CONFIG. uvicorn applies it before it imports the app, so what
# is logged while importing gets it too. Every record starts with its time, level and logger, uvicorn's own included,
# so a line that doesn't - such as a traceback's - is known to continue the record before it (`config.alloy`). All of
# it goes to stderr: Docker keeps stdout and stderr apart, and a record logged on the one could land between a record
# on the other and its traceback. Requests aren't logged here but by Caddy (`Caddyfile`), which has how long each took
# and leaves out the API keys in their queries.
version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.access:
    handlers: [default]
    level: WARNING
    propagate: false
root:
  handlers: [default]
  level: INFO

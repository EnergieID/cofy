[project]
name = "cofy-website-contact"
version = "0.0.0"
description = "The website's contact form endpoint, run as a Scaleway serverless function."
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
]

[tool.poe.env]
PYTHONPYCACHEPREFIX = ".pycache"

[tool.poe.tasks]
lint = "ruff check --fix"
format = "ruff format"
test = "pytest --rootdir=. --import-mode=importlib -p no:cacheprovider tests"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = [
    "E501",
]
